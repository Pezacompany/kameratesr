<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEHICLE DETECTOR</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  :root {
    --bg: #030a0e;
    --panel: #060f14;
    --border: #0e2a35;
    --accent: #00e5ff;
    --accent2: #ff3d00;
    --accent3: #76ff03;
    --text: #b0d8e0;
    --dim: #2a4a55;
    --grid: rgba(0, 229, 255, 0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,229,255,0.06) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  /* TOP BAR */
  .topbar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,15,20,0.9);
    backdrop-filter: blur(8px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 36px; height: 36px;
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
  }

  .logo-icon::before {
    content: '';
    position: absolute;
    inset: 3px;
    background: var(--accent);
    clip-path: polygon(4px 0%, 100% 0%, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0% 100%, 0% 4px);
    opacity: 0.3;
  }

  .logo-icon svg { width: 18px; height: 18px; fill: var(--accent); z-index: 1; }

  .logo-text {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 4px;
    color: #fff;
    text-transform: uppercase;
  }

  .logo-text span { color: var(--accent); }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
  }

  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 6px;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .status-dot.live {
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
    animation: blink 1.2s infinite;
  }

  .status-dot.detecting {
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* MAIN LAYOUT */
  .main {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 0;
    height: calc(100vh - 65px);
  }

  /* VIDEO AREA */
  .video-section {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  .video-wrapper {
    position: relative;
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16/9;
  }

  #videoEl {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border: 1px solid var(--border);
    background: #000;
    transform: scaleX(-1);
  }

  #canvasEl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
  }

  /* Corner decorations */
  .corner {
    position: absolute;
    width: 20px; height: 20px;
    z-index: 10;
    pointer-events: none;
  }
  .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-tr { top: -1px; right: -1px; border-top: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .corner-bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  /* Scan line animation */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    pointer-events: none;
    z-index: 8;
    animation: scan 3s linear infinite;
  }

  @keyframes scan {
    0% { top: 0%; opacity: 0; }
    5% { opacity: 0.6; }
    95% { opacity: 0.6; }
    100% { top: 100%; opacity: 0; }
  }

  /* Overlay states */
  .video-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(3,10,14,0.85);
    z-index: 20;
    transition: opacity 0.4s;
  }

  .video-overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-icon {
    width: 64px; height: 64px;
    border: 2px solid var(--dim);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(12px 0%, 100% 0%, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0% 100%, 0% 12px);
  }

  .overlay-icon svg { width: 30px; height: 30px; fill: var(--dim); }

  .overlay-text {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
  }

  .start-btn {
    margin-top: 8px;
    padding: 10px 32px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .start-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .start-btn:hover::before { opacity: 0.12; }
  .start-btn:hover { box-shadow: 0 0 20px rgba(0,229,255,0.3); }
  .start-btn:active { transform: scale(0.97); }
  .start-btn span { position: relative; z-index: 1; }

  /* HUD bottom bar */
  .hud-bar {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
  }

  .hud-item {
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--dim);
    line-height: 1.8;
  }

  .hud-item .val {
    display: block;
    font-size: 20px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 2px;
  }

  /* SIDEBAR */
  .sidebar {
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-title {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .badge {
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    font-size: 11px;
    padding: 2px 8px;
    letter-spacing: 1px;
  }

  /* Detection list */
  .detection-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .detection-list::-webkit-scrollbar { width: 4px; }
  .detection-list::-webkit-scrollbar-track { background: transparent; }
  .detection-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .det-item {
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: rgba(0,229,255,0.02);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: fadeIn 0.2s ease;
    clip-path: polygon(6px 0%, 100% 0%, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0% 100%, 0% 6px);
    transition: border-color 0.3s;
  }

  .det-item.vehicle { border-color: rgba(0,229,255,0.4); background: rgba(0,229,255,0.04); }
  .det-item.person  { border-color: rgba(255,61,0,0.4);  background: rgba(255,61,0,0.04);  }
  .det-item.other   { border-color: rgba(118,255,3,0.3);  background: rgba(118,255,3,0.03); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(10px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .det-icon {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid currentColor;
    flex-shrink: 0;
  }

  .det-icon svg { width: 16px; height: 16px; }

  .vehicle .det-icon { color: var(--accent); }
  .person .det-icon  { color: var(--accent2); }
  .other .det-icon   { color: var(--accent3); }

  .det-info { flex: 1; min-width: 0; }

  .det-label {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vehicle .det-label { color: var(--accent); }
  .person .det-label  { color: var(--accent2); }
  .other .det-label   { color: var(--accent3); }

  .det-score {
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .score-bar {
    height: 2px;
    background: var(--border);
    margin-top: 4px;
    position: relative;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    background: currentColor;
    transition: width 0.3s;
  }

  .vehicle .score-fill { color: var(--accent); }
  .person .score-fill  { color: var(--accent2); }
  .other .score-fill   { color: var(--accent3); }

  .no-detections {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
    padding: 20px;
  }

  .no-det-icon {
    width: 48px; height: 48px;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
  }

  .no-det-icon svg { width: 22px; height: 22px; fill: var(--border); }

  /* Stats section */
  .stats-section {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
  }

  .stats-title {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-box {
    padding: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
    display: block;
    margin-bottom: 4px;
  }

  .stat-val {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
    color: #fff;
  }

  .stat-val.v { color: var(--accent); }
  .stat-val.p { color: var(--accent2); }

  /* FPS meter */
  .fps-bar {
    border-top: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .fps-label { font-size: 10px; letter-spacing: 2px; color: var(--dim); flex-shrink: 0; }
  .fps-track { flex: 1; height: 3px; background: var(--border); overflow: hidden; }
  .fps-fill  { height: 100%; background: var(--accent3); transition: width 0.5s; }
  .fps-val   { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px; color: var(--accent3); flex-shrink: 0; width: 44px; text-align: right; }

  /* Loading indicator */
  .loading-ring {
    width: 36px; height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.4L19.5 8 12 11.6 4.5 8 12 4.4zM4 9.7l7 3.5v6.9l-7-3.5V9.7zm9 10.4v-6.9l7-3.5v6.9l-7 3.5z"/></svg>
    </div>
    <div class="logo-text">VEHICLE<span>SCAN</span></div>
  </div>
  <div class="topbar-right">
    <span><span class="status-dot" id="camDot"></span>KAMERA</span>
    <span><span class="status-dot" id="modelDot"></span>MODEL AI</span>
    <span><span class="status-dot detecting" id="detDot" style="display:none"></span><span id="detLabel" style="display:none">WYKRYWANIE</span></span>
    <span id="timeDisplay">--:--:--</span>
  </div>
</div>

<div class="main">
  <div class="video-section">
    <div class="video-wrapper" id="videoWrapper">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="scan-line" id="scanLine" style="display:none"></div>

      <video id="videoEl" autoplay muted playsinline></video>
      <canvas id="canvasEl"></canvas>

      <div class="video-overlay" id="overlay">
        <div id="overlayContent">
          <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
            <div class="overlay-icon">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            </div>
            <div class="overlay-text">SYSTEM GOTOWY</div>
            <button class="start-btn" onclick="startCamera()"><span>▶ URUCHOM KAMERĘ</span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="hud-bar">
      <div class="hud-item">
        POJAZDY WYKRYTE
        <span class="val" id="hudVehicles">0</span>
      </div>
      <div class="hud-item" style="text-align:center">
        OBIEKTY ŁĄCZNIE
        <span class="val" id="hudTotal">0</span>
      </div>
      <div class="hud-item" style="text-align:right">
        UFNOŚĆ MAKS.
        <span class="val" id="hudConf">—</span>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">DETEKCJE</span>
      <span class="badge" id="countBadge">0</span>
    </div>

    <div class="detection-list" id="detectionList">
      <div class="no-detections" id="noDetMsg">
        <div class="no-det-icon">
          <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </div>
        OCZEKIWANIE NA<br>OBRAZ KAMERY
      </div>
    </div>

    <div class="stats-section">
      <div class="stats-title">// STATYSTYKI SESJI</div>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Pojazdy</span>
          <span class="stat-val v" id="statVehicles">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Osoby</span>
          <span class="stat-val p" id="statPersons">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Inne obiekty</span>
          <span class="stat-val" id="statOther">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">Łącznie klatek</span>
          <span class="stat-val" id="statFrames">0</span>
        </div>
      </div>
    </div>

    <div class="fps-bar">
      <span class="fps-label">FPS</span>
      <div class="fps-track"><div class="fps-fill" id="fpsFill" style="width:0%"></div></div>
      <span class="fps-val" id="fpsVal">—</span>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────
const VEHICLE_CLASSES = ['car','truck','bus','motorcycle','bicycle','airplane','boat','train'];
const CLASS_COLORS = {
  vehicle: '#00e5ff',
  person:  '#ff3d00',
  other:   '#76ff03',
};

const BOX_COLORS = {
  vehicle: { stroke: '#00e5ff', fill: 'rgba(0,229,255,0.08)' },
  person:  { stroke: '#ff3d00', fill: 'rgba(255,61,0,0.08)' },
  other:   { stroke: '#76ff03', fill: 'rgba(118,255,3,0.06)' },
};

// ─── STATE ────────────────────────────────────────────────────────────────
let model = null;
let stream = null;
let detecting = false;
let animId = null;
let lastFrameTime = performance.now();
let fps = 0;
let totalFrames = 0;
let sessionCounts = { vehicle: 0, person: 0, other: 0 };

const video  = document.getElementById('videoEl');
const canvas = document.getElementById('canvasEl');
const ctx    = canvas.getContext('2d');

// ─── CLOCK ────────────────────────────────────────────────────────────────
setInterval(() => {
  const now = new Date();
  document.getElementById('timeDisplay').textContent =
    now.toTimeString().slice(0, 8);
}, 1000);

// ─── LOAD MODEL ──────────────────────────────────────────────────────────
(async () => {
  const dot = document.getElementById('modelDot');
  dot.style.background = '#ffb300';
  dot.style.boxShadow = '0 0 8px #ffb300';
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    dot.classList.add('live');
  } catch(e) {
    dot.style.background = '#f44';
    console.error('Model load failed:', e);
  }
})();

// ─── START CAMERA ────────────────────────────────────────────────────────
async function startCamera() {
  const overlay = document.getElementById('overlay');
  const oc = document.getElementById('overlayContent');
  oc.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
    <div class="loading-ring"></div>
    <div class="overlay-text" style="font-size:11px">INICJALIZACJA KAMERY...</div>
  </div>`;

  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: {ideal:1280}, height: {ideal:720} }, audio: false });
    video.srcObject = stream;
    await video.play();

    // Cam dot
    const camDot = document.getElementById('camDot');
    camDot.classList.add('live');

    // Hide overlay
    overlay.classList.add('hidden');

    // Show scan line & detect indicator
    document.getElementById('scanLine').style.display = 'block';
    document.getElementById('detDot').style.display   = 'inline-block';
    document.getElementById('detLabel').style.display = 'inline';

    video.addEventListener('loadedmetadata', () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      startDetection();
    }, { once: true });

  } catch(e) {
    oc.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div class="overlay-text" style="color:#ff3d00;font-size:11px">BRAK DOSTĘPU DO KAMERY</div>
      <div style="font-size:10px;color:#2a4a55;letter-spacing:1px;text-align:center;max-width:220px">${e.message}</div>
      <button class="start-btn" onclick="startCamera()"><span>↺ SPRÓBUJ PONOWNIE</span></button>
    </div>`;
  }
}

// ─── DETECTION LOOP ──────────────────────────────────────────────────────
function startDetection() {
  if (detecting) return;
  detecting = true;
  loop();
}

async function loop() {
  if (!detecting) return;

  const now = performance.now();
  fps = Math.round(1000 / (now - lastFrameTime));
  lastFrameTime = now;
  totalFrames++;

  // Run detection every 2nd frame for perf
  if (totalFrames % 2 === 0 && model && video.readyState >= 2) {
    const predictions = await model.detect(video);
    renderFrame(predictions);
    updateSidebar(predictions);
  }

  updateFPS();
  document.getElementById('statFrames').textContent = totalFrames;
  animId = requestAnimationFrame(loop);
}

// ─── RENDER ───────────────────────────────────────────────────────────────
function getType(label) {
  if (label === 'person') return 'person';
  if (VEHICLE_CLASSES.includes(label)) return 'vehicle';
  return 'other';
}

function renderFrame(predictions) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  predictions.forEach(pred => {
    const [x, y, w, h] = pred.bbox;
    const score  = pred.score;
    const type   = getType(pred.class);
    const colors = BOX_COLORS[type];

    // Box
    ctx.strokeStyle = colors.stroke;
    ctx.fillStyle   = colors.fill;
    ctx.lineWidth   = 2;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);

    // Corner accents
    const cLen = 14;
    ctx.strokeStyle = colors.stroke;
    ctx.lineWidth = 3;
    // TL
    ctx.beginPath(); ctx.moveTo(x, y + cLen); ctx.lineTo(x, y); ctx.lineTo(x + cLen, y); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(x+w-cLen, y); ctx.lineTo(x+w, y); ctx.lineTo(x+w, y+cLen); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(x, y+h-cLen); ctx.lineTo(x, y+h); ctx.lineTo(x+cLen, y+h); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(x+w-cLen, y+h); ctx.lineTo(x+w, y+h); ctx.lineTo(x+w, y+h-cLen); ctx.stroke();

    // Label bg
    const label = pred.class.toUpperCase();
    const pct   = Math.round(score * 100);
    const text  = `${label}  ${pct}%`;
    ctx.font = 'bold 12px "Share Tech Mono", monospace';
    const tw = ctx.measureText(text).width;
    const lx = x;
    const ly = y > 22 ? y - 24 : y + h + 4;

    ctx.fillStyle = colors.stroke;
    ctx.fillRect(lx, ly, tw + 16, 20);

    ctx.fillStyle = '#000';
    ctx.fillText(text, lx + 8, ly + 14);
  });
}

// ─── SIDEBAR ──────────────────────────────────────────────────────────────
const ICONS = {
  vehicle: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>`,
  person:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
  other:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`,
};

let prevVehicles = 0, prevPersons = 0, prevOther = 0;

function updateSidebar(predictions) {
  const list  = document.getElementById('detectionList');
  const noMsg = document.getElementById('noDetMsg');

  const vehicles = predictions.filter(p => getType(p.class) === 'vehicle');
  const persons  = predictions.filter(p => getType(p.class) === 'person');
  const others   = predictions.filter(p => getType(p.class) === 'other');

  // Update session counters
  if (vehicles.length > prevVehicles) sessionCounts.vehicle += vehicles.length - prevVehicles;
  if (persons.length  > prevPersons)  sessionCounts.person  += persons.length  - prevPersons;
  if (others.length   > prevOther)    sessionCounts.other   += others.length   - prevOther;

  prevVehicles = vehicles.length;
  prevPersons  = persons.length;
  prevOther    = others.length;

  document.getElementById('statVehicles').textContent = sessionCounts.vehicle;
  document.getElementById('statPersons').textContent  = sessionCounts.person;
  document.getElementById('statOther').textContent    = sessionCounts.other;

  // HUD
  document.getElementById('hudVehicles').textContent = vehicles.length;
  document.getElementById('hudTotal').textContent    = predictions.length;
  document.getElementById('countBadge').textContent  = predictions.length;

  const maxConf = predictions.length ? Math.max(...predictions.map(p => p.score)) : null;
  document.getElementById('hudConf').textContent = maxConf ? Math.round(maxConf*100) + '%' : '—';

  if (!predictions.length) {
    if (!noMsg.parentElement) list.appendChild(noMsg);
    noMsg.style.display = 'flex';
    // Remove items
    [...list.querySelectorAll('.det-item')].forEach(el => el.remove());
    return;
  }

  noMsg.style.display = 'none';

  // Rebuild list
  [...list.querySelectorAll('.det-item')].forEach(el => el.remove());

  const sorted = [...predictions].sort((a,b) => b.score - a.score);

  sorted.forEach(pred => {
    const type = getType(pred.class);
    const pct  = Math.round(pred.score * 100);
    const item = document.createElement('div');
    item.className = `det-item ${type}`;
    item.innerHTML = `
      <div class="det-icon">${ICONS[type]}</div>
      <div class="det-info">
        <div class="det-label">${pred.class}</div>
        <div class="det-score">UFNOŚĆ: ${pct}%</div>
        <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
      </div>
    `;
    list.appendChild(item);
  });
}

// ─── FPS ─────────────────────────────────────────────────────────────────
function updateFPS() {
  const capped = Math.min(fps, 60);
  document.getElementById('fpsVal').textContent  = fps + ' fps';
  document.getElementById('fpsFill').style.width = (capped / 60 * 100) + '%';
}
</script>
